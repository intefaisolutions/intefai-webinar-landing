<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful | IntefAI Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Meta Pixel Code -->

  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '2176493736542744');
  fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=2176493736542744&ev=PageView&noscript=1"
  /></noscript>

  <style>
    .success-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      text-align: center;
    }
    .success-card {
      width: min(520px, 100%);
      background: #fff;
      border: 1px solid rgba(26, 54, 93, 0.12);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      box-shadow: 0 24px 60px rgba(26, 54, 93, 0.08);
    }
    .success-card h1 {
      margin: 0 0 0.75rem;
      font-size: 1.6rem;
      background: linear-gradient(135deg, #ff8c42, #ff4b4b, #b83280);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .success-card p {
      margin: 0 0 0.75rem;
      color: #3a4658;
      line-height: 1.55;
      font-weight: 500;
    }
    .success-card .ok {
      color: #1a365d;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="success-wrap">
    <div class="success-card">
      <img src="assets/intefai-logo.png" alt="IntefAI Academy" width="180" style="height:auto;margin-bottom:1rem;" />
      <h1>Payment successful</h1>
      <p class="ok" id="status">Confirming your registration…</p>
      <p>
        You’re registered for the AI Video Creation Webinar<br />
        <strong>23rd August 2026 · 7:00 PM · Live Online</strong>
      </p>
      <p>A WhatsApp confirmation will be sent to your registered number shortly.</p>
    </div>
  </main>

  <script src="config.js"></script>
  <script>
    (async function () {
      const statusEl = document.getElementById("status");
      const params = new URLSearchParams(window.location.search);
      const lead = JSON.parse(sessionStorage.getItem("intefai_lead") || "{}");

      const paymentId =
        params.get("razorpay_payment_id") ||
        params.get("payment_id") ||
        "";
      const linkStatus = (
        params.get("razorpay_payment_link_status") ||
        params.get("status") ||
        ""
      ).toLowerCase();

      // If Razorpay explicitly says not paid, stop.
      if (linkStatus && linkStatus !== "paid" && linkStatus !== "captured") {
        statusEl.textContent = "Payment not completed yet.";
        return;
      }

      const cfg = window.INTEFAI_CONFIG || {};
      if (!cfg.GOOGLE_SCRIPT_URL) {
        statusEl.textContent = "Payment received. (Sheet sync URL missing)";
        return;
      }

      // If no lead in session (different browser), still try with query email if any
      const email = lead.email || params.get("email") || "";
      const whatsapp = lead.whatsapp || params.get("contact") || "";

      try {
        await fetch(cfg.GOOGLE_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "payment_success",
            email: email,
            whatsapp: whatsapp,
            name: [lead.firstName, lead.lastName].filter(Boolean).join(" "),
            paymentId: paymentId,
          }),
        });
        statusEl.textContent = "Registration confirmed. See you in the webinar!";
        try {
          if (typeof fbq === "function") {
            fbq("track", "Purchase", {
              value: 9.0,
              currency: "INR",
              content_name: "AI Video Creation Webinar",
            });
            fbq("track", "CompleteRegistration", {
              content_name: "AI Video Creation Webinar",
              status: true,
            });
          }
        } catch (pixelErr) {}
      } catch (err) {
        statusEl.textContent =
          "Payment done. Confirmation may take a minute via webhook.";
        try {
          if (typeof fbq === "function") {
            fbq("track", "Purchase", {
              value: 9.0,
              currency: "INR",
              content_name: "AI Video Creation Webinar",
            });
          }
        } catch (pixelErr) {}
      }
    })();
  </script>
</body>
</html>
